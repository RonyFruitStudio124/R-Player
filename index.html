<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a1c">
<title>R-Player</title>
<style>
:root{
  --bg:#0a0a1c; --bar:#0d0d24; --card:#15152f; --card2:#1e1e3d; --line:#26264d;
  --txt:#f4f4ff; --mut:#8b8db4; --acc:#7c5cff; --acc2:#b39dff; --accdark:#ffffff;
  --grad:linear-gradient(135deg,#6a4cff,#a64dff);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.ic{width:24px;height:24px;fill:currentColor;display:block;pointer-events:none}
.mut{color:var(--mut)}

/* ---------- Shell ---------- */
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding-bottom:calc(90px + var(--safe-b))}
body.has-amini #app{padding-bottom:calc(160px + var(--safe-b))}
.head{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:var(--safe-t)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 8px 18px}
.title{font-size:27px;font-weight:700}
.actions{display:flex;gap:2px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--txt);transition:background .15s}
.icon-btn:active{background:rgba(255,255,255,.1)}
.searchbar{display:flex;align-items:center;gap:6px;margin:2px 14px 8px;padding:2px 4px 2px 16px;background:var(--card);border-radius:14px}
.searchbar input{flex:1;background:none;border:0;outline:0;color:var(--txt);padding:11px 0}
.pills{display:flex;gap:10px;padding:6px 14px 12px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:9px;height:50px;padding:0 20px;border-radius:26px;background:#3b3b3b;color:#d4d4d4;font-size:17px;font-weight:500;white-space:nowrap}
.pill .ic{width:22px;height:22px}
.pill.home{padding:0 20px}
.pill.active{background:#27472c;color:#86ea97}
.pane{display:none}
.pane.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:640px;margin:0 auto;display:flex;background:var(--bar);border-top:1px solid #353535;padding-bottom:var(--safe-b)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:#9d9d9d;font-size:13px}
.bnav button.active{color:var(--acc)}
.bnav .ic{width:30px;height:30px}

/* ---------- Summary, rows ---------- */
.summary{display:flex;align-items:center;gap:14px;padding:12px 14px 6px;font-size:16px;letter-spacing:.6px;text-transform:uppercase}
.summary .sz{color:var(--mut)}
.summary .sp{flex:1}
.sbtn{width:42px;height:42px;display:grid;place-items:center;color:#d6d6d6;border-radius:50%}
.sbtn:active{background:rgba(255,255,255,.1)}
.recent{display:flex;gap:12px;overflow-x:auto;padding:6px 14px 14px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rcard{flex:none;width:158px;cursor:pointer}
.rcard .vthumb{width:158px;height:90px;border-radius:6px}
.vrow{display:flex;gap:14px;padding:9px 14px;cursor:pointer}
.vrow:active,.frow:active,.arow:active{background:#2e2e2e}
.vthumb{position:relative;flex:none;width:150px;height:96px;border-radius:6px;overflow:hidden;background:#121212}
.vthumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.dur{position:absolute;right:6px;bottom:7px;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.62);border-radius:5px;padding:1px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.dur .ic{width:14px;height:14px}
.dur b{font-weight:500}
.vprog{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.vtop{display:flex;gap:4px;align-items:flex-start}
.vtop b{flex:1;font-weight:500;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dots{flex:none;width:36px;height:36px;display:grid;place-items:center;color:#b8b8b8;margin:-6px -8px 0 0;border-radius:50%}
.dots:active{background:rgba(255,255,255,.1)}
.vinfo small{align-self:flex-end;color:var(--mut);font-size:14px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:8px 14px}
.vcell{cursor:pointer}
.vcell .vthumb{width:100%;height:auto;aspect-ratio:16/10}
.vcell .vtop{margin-top:6px}
.vcell .vtop b{-webkit-line-clamp:2;font-size:14px}
.vcell small{display:block;color:var(--mut);font-size:12.5px}
.frow{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer}
.frow>.ic{width:42px;height:42px;color:var(--acc);flex:none}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta small{color:var(--mut)}
.backrow{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:18px;font-weight:600;min-width:0}
.backrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mut);padding:70px 24px}
.empty>.ic{width:60px;height:60px;margin:0 auto 12px;opacity:.5}
.empty small{display:block;margin-top:4px}
.empty .btn{margin-top:18px}
.note{padding:10px 14px;font-size:13px}

/* ---------- Music ---------- */
.arow{display:flex;align-items:center;gap:14px;padding:9px 14px;cursor:pointer}
.acover{position:relative;width:54px;height:54px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3b3b3b,#2a2a2a);color:var(--acc)}
.acover.sm{width:42px;height:42px;border-radius:9px}
.arow.playing .acover{background:var(--acc);color:var(--accdark)}
.arow.playing .meta b{color:var(--acc)}
.arow .meta{flex:1;min-width:0}
.arow .meta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .meta small{color:var(--mut)}
.eq{display:none;gap:3px;align-items:flex-end;height:18px}
.arow.playing .eq{display:flex}
.arow.playing .acover>.ic{display:none}
.eq i{width:3px;height:100%;background:var(--accdark);border-radius:2px;transform-origin:bottom;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
.arow.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.amini{position:fixed;left:10px;right:10px;max-width:620px;margin:0 auto;bottom:calc(72px + var(--safe-b));z-index:25;overflow:hidden;
  display:flex;align-items:center;gap:4px;padding:8px 4px 11px 10px;background:var(--card2);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
.amini .ainfo{flex:1;min-width:0;margin-left:6px;cursor:pointer}
.amini .ainfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.amini .ainfo small{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.amini .icon-btn{width:40px;height:40px}
.amini .pp{background:var(--acc);color:var(--accdark)}
.amini .aprog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--acc)}
.mini{position:fixed;left:10px;right:10px;max-width:620px;margin:0 auto;bottom:calc(72px + var(--safe-b));z-index:25;
  display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;background:var(--card2);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
.mini span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

/* ---------- Panels, forms ---------- */
.panel{background:var(--card);border-radius:18px;padding:18px;margin:6px 14px 14px}
.panel h3{margin:0 0 6px}
.panel p{margin:0 0 14px;font-size:14px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;outline:0;margin-bottom:10px}
.field:focus{border-color:var(--acc)}
.btnrow{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;background:var(--acc);color:var(--accdark);text-align:center}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.sm{flex:none;padding:10px 18px;display:inline-flex;gap:6px;align-items:center;border-radius:22px}
.btn.sm .ic{width:20px;height:20px}
.btn:active{filter:brightness(.9)}
#dlList{padding:0 14px}
.task{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:6px;background:var(--bg);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.bar.indet i{width:35%!important;animation:ind 1.1s infinite ease-in-out}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.tstat{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:10px}
.tstat button{color:var(--acc);font-weight:700}
.lockbox{text-align:center;padding:30px 20px}
.lockbox .big-ic{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--acc)}
.lockbox .big-ic .ic{width:36px;height:36px}
.pin{text-align:center;letter-spacing:10px;font-size:22px;max-width:240px;margin:10px auto}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.privhead{display:flex;align-items:center;justify-content:space-between;padding:6px 14px}
.privhead button{color:var(--acc);font-weight:700;padding:8px}
.plhead{display:flex;align-items:center;justify-content:space-between;padding-right:14px;gap:8px}
.newpl{display:flex;align-items:center;gap:14px;width:calc(100% - 28px);margin:8px 14px 6px;padding:14px;border-radius:14px;background:var(--card);font-weight:600;color:var(--acc)}

/* ---------- Bottom sheet, dialog, toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;z-index:101;background:#2f2f2f;border-radius:22px 22px 0 0;
  padding:8px 8px calc(14px + var(--safe-b));max-height:75dvh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#4a4a4a;margin:4px auto 8px}
.sheet h4,.dialog h4{margin:4px 14px 8px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:12px;text-align:left}
.row:active{background:var(--card2)}
.row span{flex:1}
.row.active{color:var(--acc)}
.row.note{color:var(--mut);font-size:13px;pointer-events:none}
.dialog{position:fixed;z-index:101;left:50%;top:38%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#2f2f2f;border-radius:20px;padding:18px;animation:fade .2s}
.dialog h4{margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);max-width:88vw;z-index:300;
  background:rgba(50,50,50,.97);padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.has-amini .toast{bottom:calc(150px + var(--safe-b))}

/* ---------- Player ---------- */
#player{position:fixed;inset:0;z-index:50;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.stage{position:absolute;inset:0;display:grid;place-items:center;container-type:size;background:#000}
#v{width:100%;height:100%;object-fit:contain;background:#000}
.stage[data-fit="fill"] #v{object-fit:cover}
.stage[data-fit="stretch"] #v{object-fit:fill}
.stage[data-fit="16:9"] #v{object-fit:fill;width:min(100cqw,calc(100cqh*16/9));height:min(100cqh,calc(100cqw*9/16))}
.stage[data-fit="4:3"]  #v{object-fit:fill;width:min(100cqw,calc(100cqh*4/3));height:min(100cqh,calc(100cqw*3/4))}
.stage[data-fit="21:9"] #v{object-fit:fill;width:min(100cqw,calc(100cqh*21/9));height:min(100cqh,calc(100cqw*9/21))}
#v::cue{background:rgba(0,0,0,.65);color:#fff;font-size:1.1em}
.gesture{position:absolute;inset:0;z-index:2;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.gind{white-space:nowrap;position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:24px;
  background:rgba(14,14,34,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);color:#fff;font-weight:700;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.gind.show{opacity:1;transform:translate(-50%,0)}
.gind .ic{width:22px;height:22px;color:var(--acc2)}
.gind .gbar{width:96px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.gind .gbar i{display:block;height:100%;background:var(--grad);border-radius:3px}
.gind.boost .gbar i{background:linear-gradient(90deg,#ffb020,#ff4f6b)}
.gind.boost .ic{color:#ffb020}
.vbox.full .gind{top:calc(16px + var(--safe-t))}
.ctrl{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  transition:opacity .25s,visibility .25s}
.ctrl>*{pointer-events:auto}
.ctrl-top,.ctrl-bottom{pointer-events:none}
.ctrl-top button,.seekrow .seek,.seekrow button,.toolrow,.toolrow button{pointer-events:auto}
.ctrl.hidden{opacity:0;visibility:hidden}
.ctrl-top{display:flex;align-items:center;gap:2px;padding:calc(8px + var(--safe-t)) 8px 30px;background:linear-gradient(rgba(0,0,0,.8),transparent)}
.ptitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:0 6px}
.ctrl button.on{color:var(--acc)}
.ctrl-mid{align-self:center;display:flex;align-items:center;gap:30px;pointer-events:none!important}
.ctrl-mid button{pointer-events:auto;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.ctrl-mid .sk{width:58px;height:58px}
.ctrl-mid .sk .ic{width:36px;height:36px}
.ctrl-mid .big{width:78px;height:78px;background:var(--acc);color:var(--accdark);box-shadow:0 6px 24px rgba(62,207,91,.4)}
.ctrl-mid .big .ic{width:42px;height:42px}
.ctrl-mid button:active{transform:scale(.92)}
.ctrl-bottom{padding:30px 14px calc(8px + var(--safe-b));background:linear-gradient(transparent,rgba(0,0,0,.85))}
.seekrow{display:flex;align-items:center;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.seek{position:relative;flex:1;height:30px;touch-action:none;cursor:pointer}
.seek::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:rgba(255,255,255,.22)}
.seek .buf,.seek .prog{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;width:0}
.seek .buf{background:rgba(255,255,255,.38)}
.seek .prog{background:var(--acc)}
.seek .knob{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgba(62,207,91,.35);transition:transform .12s}
.seek.drag .knob{transform:scale(1.5)}
.seek .tip{position:absolute;bottom:30px;left:0;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:3px 9px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .12s;pointer-events:none}
.seek.drag .tip{opacity:1}
.toolrow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.tool{min-width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.tool:active{background:rgba(255,255,255,.12)}
.tool.txt{font-weight:800;font-size:15px}
.unlock{position:absolute;z-index:6;left:50%;bottom:calc(46px + var(--safe-b));transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  padding:12px 22px;border-radius:30px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.25);font-weight:600;
  opacity:0;visibility:hidden;transition:.25s}
.unlock.show{opacity:1;visibility:visible}
.spinner{position:absolute;z-index:2;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;
  border:4px solid rgba(255,255,255,.2);border-top-color:var(--acc);animation:spin .8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tapfx{position:absolute;z-index:2;top:50%;margin-top:-50px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-weight:700;opacity:0;pointer-events:none}
.tapfx.l{left:10%}.tapfx.r{right:10%}
.tapfx.go{animation:tap .5s}
@keyframes tap{0%{opacity:0;transform:scale(.7)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.flash{position:absolute;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
/* ===== R-Player theme ===== */
html{background:#0a0a1c}
body{background:radial-gradient(120% 55% at 50% -10%,#231769 0%,rgba(10,10,28,0) 62%) no-repeat,var(--bg)}
.head{background:rgba(10,10,28,.9);backdrop-filter:blur(12px)}
.title.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800}
.title.brand .ic{width:32px;height:32px}
.title.brand span{background:linear-gradient(90deg,#fff,#cdb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:#171737;color:#c4c5e6}
.pill.active{background:rgba(124,92,255,.25);color:#c1b2ff}
.bnav{background:rgba(13,13,36,.96);backdrop-filter:blur(14px);border-top:1px solid #23234a}
.bnav button{color:#8b8db4;gap:3px;padding:8px 0 7px}
.bnav .ico{display:grid;place-items:center;width:46px;height:30px;border-radius:12px}
.bnav .ico .ic{width:24px;height:24px}
.bnav button.active{color:#b9a8ff}
.bnav button.active .ico{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.5)}
.btn,.amini .pp,.ctrl-mid .big{background:var(--grad);color:#fff}
.ctrl-mid .big{box-shadow:0 6px 24px rgba(124,92,255,.5)}
.seek .prog,.vprog,.bar i,.amini .aprog{background:var(--grad)}
.seek .knob{box-shadow:0 0 0 4px rgba(124,92,255,.4)}
.arow .acover{color:#b39dff}
.arow.playing .acover{background:var(--grad);color:#fff}
.eq i{background:#fff}
.toast{background:rgba(32,32,66,.97)}
.sheet,.dialog{background:#17173a}
.mini,.amini{background:#1b1b42}
.vthumb{background:#101028}

/* ===== Home ===== */
.greet{display:flex;align-items:center;gap:14px;padding:14px 18px 16px}
.greet small{display:block;color:var(--mut);font-size:12.5px}
.greet b{display:block;font-size:19px;line-height:1.25}
.sunc{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:radial-gradient(circle at 35% 30%,#ffd37a,#ff9a3c);box-shadow:0 0 0 4px rgba(255,170,60,.22)}
.sunc .ic{width:30px;height:30px}
.banner{margin:0 14px 14px;padding:20px 18px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:linear-gradient(110deg,#4527c9,#7d3df0 60%,#5a46f5);box-shadow:0 10px 30px rgba(90,60,230,.35)}
.banner b{display:block;font-size:20px}
.banner small{opacity:.8}
.bplay{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff6aa8,#ff4f8b);box-shadow:0 6px 18px rgba(255,80,140,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 6px}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;text-align:left;background:var(--card);border:1px solid var(--line)}
@supports (background:color-mix(in srgb,red,blue)){.tile{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,#12122c),#12122c 78%)}}
.tic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.tile b{display:block;font-size:15px}
.tile small{color:var(--mut);font-size:14px}
.sechead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.sechead b{font-size:17px}
.sechead button{display:flex;align-items:center;color:#b9a8ff;font-size:13px}
.sechead .ic{width:18px;height:18px}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hcell{flex:none;width:140px;cursor:pointer}
.hcell .vthumb{width:140px;height:84px;border-radius:12px}
.hcell b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:600;margin-top:7px;line-height:1.3;word-break:break-word}
.hcell small{color:var(--mut);font-size:12px}
.hcell .dur .ic{display:none}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:1000;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1b1250 0%,#4a2a8f 30%,#b2559a 52%,#241552 57%,#0c0a26 100%);transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .mnt{position:absolute;left:0;right:0;top:31%;width:100%;height:26%}
.s-mid{position:relative;text-align:center;margin-top:-14vh}
.s-logo{width:104px;height:104px;filter:drop-shadow(0 8px 30px rgba(150,90,255,.6))}
.s-name{font-size:44px;font-weight:800;margin-top:10px;background:linear-gradient(90deg,#fff,#d6c2ff 50%,#9db7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-tag{opacity:.9;margin-top:4px}
.s-foot{position:absolute;bottom:calc(36px + var(--safe-b));left:0;right:0;text-align:center;font-size:13px;opacity:.85}
.s-foot i{display:inline-block;width:4px;height:4px;border-radius:50%;background:#a78bfa;margin:0 8px;vertical-align:middle}
.s-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.35);margin:16px auto 0}

/* ===== Library screens ===== */
.title{font-size:24px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar.hasback{padding-left:6px}
.topbar.hasback .title{font-size:19px;font-weight:600}
.title.brand{font-size:23px;font-weight:800}
.favic{display:inline-grid;vertical-align:middle;color:#ff4f8b;margin-right:10px}
.favic .ic{width:26px;height:26px}
.chips{display:flex;gap:10px;padding:6px 14px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 20px;border-radius:20px;background:#171737;color:#c4c5e6;font-weight:600;font-size:14px}
.chip.active{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.4)}
.vrow{display:flex;align-items:center;gap:14px;padding:8px 14px;cursor:pointer}
.vrow:active{background:rgba(255,255,255,.04)}
.vrow .vthumb{width:104px;height:68px;border-radius:12px}
.minfo{flex:1;min-width:0}
.minfo b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14.5px;line-height:1.3;word-break:break-word}
.minfo small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.vrow .dots{margin:0 -6px 0 0}
.heartbtn{width:38px;height:38px;display:grid;place-items:center;color:#ff4f8b;flex:none}
.heartbtn .ic{width:26px;height:26px}
.vthumb .dur{right:5px;bottom:5px;padding:1px 6px;font-size:11px;font-weight:600;border-radius:6px;background:rgba(10,10,28,.72)}
.vthumb .dur .ic{display:none}
.frow{margin:0 14px 10px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);gap:14px}
.frow:active{background:var(--card2)}
.fic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--c),var(--c2))}
.fic .ic{width:26px;height:26px}
.chev{display:grid;color:var(--mut)}
.chev .ic{width:22px;height:22px}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(84px + var(--safe-b));width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(124,92,255,.55);z-index:22}
.fab .ic{width:30px;height:30px}
body.has-amini .fab{bottom:calc(150px + var(--safe-b))}
#pane-folders,#pane-favs,#pane-history{padding-top:8px}

/* ===== History / Explore ===== */
.favic.hisic{color:#8b5cf6}
.sfield{display:flex;align-items:center;gap:10px;margin:calc(var(--safe-t) + 14px) 14px 6px;padding:0 6px 0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.sfield>.ic{width:22px;height:22px;color:var(--mut);flex:none}
.sfield input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);padding:14px 0;font-size:15px}
.sfield input::placeholder{color:#7d7fa8}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;font-size:16px;font-weight:700}
.sh em{font-style:normal;color:var(--mut);font-weight:500;font-size:13px}
.sh button{display:flex;align-items:center;color:#b9a8ff;font-size:13px;font-weight:500}
.sh .ic{width:18px;height:18px}
.rchips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px}
.rchip{padding:7px 16px;border-radius:18px;background:#1e1e3d;color:#d3d4f2;font-size:13.5px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.cat{height:84px;border-radius:16px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:0 14px;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.cat .ic{width:26px;height:26px}
.catbar{display:flex;align-items:center;gap:8px;padding:6px 14px 10px}
.catx{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--card2)}
.catx .ic{width:18px;height:18px}

/* ===== Player ===== */
#player{background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-t)}
#player.isfull{padding-top:0}
.vbox{position:relative;flex:none;width:100%;aspect-ratio:16/9;max-height:46dvh;background:#000;overflow:hidden}
.vbox.full{position:fixed;inset:0;width:auto;aspect-ratio:auto;max-height:none;z-index:60}
.vbox:not(.full) .ctrl-top{padding:6px 6px 24px}
.vbox:not(.full) .ptitle{visibility:hidden}
.vbox:not(.full) .fsonly{display:none}
.vbox:not(.full) .ctrl-bottom{padding:18px 10px 2px}
.vbox.full .ctrl-top{padding-top:calc(8px + var(--safe-t))}
.hiddenctl{display:none}
.ctrl-mid{gap:12px}
.ctrl-mid .sk{width:42px;height:42px}
.ctrl-mid .sk .ic{width:26px;height:26px}
.ctrl-mid .sk2{width:50px;height:50px}
.ctrl-mid .sk2 .ic{width:30px;height:30px}
.ctrl-mid .big{width:66px;height:66px;background:rgba(18,16,46,.55);color:#fff;box-shadow:0 0 0 2px rgba(180,160,255,.55)}
.ctrl-mid .big .ic{width:38px;height:38px}
.vbox.full .ctrl-mid{gap:26px}
.seekrow .fsb{min-width:38px;height:38px}
.pinfo{flex:1;min-height:0;overflow:auto;padding:16px 14px calc(22px + var(--safe-b))}
#player.isfull .pinfo{display:none}
.ptitle2{font-size:19px;font-weight:700;line-height:1.3;word-break:break-word}
.pmeta{color:var(--mut);font-size:13.5px;margin-top:4px}
.pactions{display:grid;grid-template-columns:repeat(5,1fr);margin:16px 0 10px;padding:10px 2px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.pquick{display:grid;grid-template-columns:repeat(5,1fr);margin:0 0 14px;padding:8px 2px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.pactions button,.pquick button{display:flex;flex-direction:column;align-items:center;gap:6px;color:#d6d7f5;font-size:12px;padding:6px 0}
.pquick button{font-size:11px;color:#a9abd0}
.pactions .ic{width:24px;height:24px}
.pquick .ic{width:21px;height:21px}
.pactions button.on,.pquick button.on{color:var(--acc2)}
.pactions button.liked{color:#ff4f8b}
.nextcard{padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.nexthead{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.apw{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px;color:#cfd0ee}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:#3a3a66;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:23px}
.nextbody{display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer}
.nextbody .vthumb{width:96px;height:62px}
.nextbody .acover{width:62px;height:62px}
.nextbody .minfo b{-webkit-line-clamp:1;font-size:14px}
.nplay{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.nonext{color:var(--mut);font-size:13.5px;padding:4px 0}

/* ===== Me / Settings ===== */
.profile{display:flex;align-items:center;gap:14px;width:calc(100% - 28px);margin:6px 14px 14px;padding:16px;border-radius:20px;text-align:left;background:linear-gradient(120deg,#2a1d7a,#4b2fd0)}
.profile>.ic{width:22px;height:22px;opacity:.8}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--grad);box-shadow:0 0 0 3px rgba(255,255,255,.25);flex:none}
.pinf{flex:1;min-width:0}
.pinf b{display:block;font-size:18px}
.pinf small{opacity:.75}
.merows{margin:0 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.merow{display:flex;align-items:center;gap:16px;width:100%;padding:15px 18px;text-align:left;border-bottom:1px solid #1f1f42;font-size:15.5px}
.merow:last-child{border-bottom:0}
.merow:active{background:var(--card2)}
.merow .ic{width:24px;height:24px;color:#c9caf0}
.merow[data-to="favs"] .ic{color:#ff4f8b}
.mefoot{margin:22px 14px 0;padding:22px 0 20px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#2b1c80,#5a2fd6 55%,#c04ad6);display:flex;flex-direction:column;align-items:center;gap:2px}
.mefoot .s-logo{width:44px;height:44px;filter:none}
.mefoot b{font-size:20px}
.mefoot small{opacity:.75}
.setgrp{padding:16px 18px 8px;color:var(--mut);font-size:13px;font-weight:600}
.setrow{display:flex;align-items:center;gap:14px;width:calc(100% - 28px);margin:0 14px 10px;padding:14px;border-radius:14px;text-align:left;background:var(--card);border:1px solid var(--line)}
.setrow:active{background:var(--card2)}
.setrow>.ic{width:22px;height:22px;color:#c9caf0;flex:none}
.setrow>span:not(.chev){flex:1;font-size:15px}
.setrow em{font-style:normal;color:var(--mut);font-size:13.5px}
</style>
</head>

<script>
(() => {
'use strict';

/* ================= Helpers ================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ico = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;

/* ================= Saved library (IndexedDB): videos & music survive a reload ================= */
let dbp;
const dbOpen = () => dbp ||= new Promise((res, rej) => {
  if (!window.indexedDB) return rej(new Error('no indexedDB'));
  const r = indexedDB.open('vibeplay', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('items'); r.result.createObjectStore('blobs'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const idb = (stores, mode, fn) => dbOpen().then(db => new Promise((res, rej) => {
  const t = db.transaction(stores, mode), out = fn(t);
  t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : out);
  t.onerror = t.onabort = () => rej(t.error);
}));
const dbKey = it => it.remote ? 'r:' + it.src : it.key + '|' + it.folder;
let roomWarn = false, askedPersist = false;
function noRoom(it) {
  if (roomWarn) return; roomWarn = true; setTimeout(() => roomWarn = false, 5000);
  toast('Not enough storage to keep "' + it.name + '". It will be gone after a reload.');
}
async function saveItem(it, kind, blob) {
  if (settings.keepLib === false) return;
  it._saved = true;
  try {
    if (blob && navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      if (e.quota && e.quota - (e.usage || 0) < blob.size + 64 * 1048576) { it._saved = false; return noRoom(it); }
    }
    const k = dbKey(it);
    const meta = { k, kind, name: it.name, folder: it.folder, size: it.size, mtime: it.mtime, ext: it.ext, added: it.added,
      priv: !!it.priv, dur: it.dur, remote: !!it.remote, src: it.remote ? it.src : undefined };
    await idb(['items', 'blobs'], 'readwrite', t => { if (blob) t.objectStore('blobs').put(blob, k); t.objectStore('items').put(meta, k); });
    if (!askedPersist && navigator.storage && navigator.storage.persist) { askedPersist = true; navigator.storage.persist().catch(() => {}); }
  } catch (e) { it._saved = false; noRoom(it); }
}
function updateSaved(it, patch) {
  if (!it._saved) return;
  const k = dbKey(it);
  idb(['items'], 'readwrite', t => { const s = t.objectStore('items'), g = s.get(k); g.onsuccess = () => g.result && s.put({ ...g.result, ...patch }, k); }).catch(() => {});
}
function dropSaved(it) {
  if (!it._saved) return;
  const k = dbKey(it); it._saved = false;
  idb(['items', 'blobs'], 'readwrite', t => { t.objectStore('items').delete(k); t.objectStore('blobs').delete(k); }).catch(() => {});
}
async function libBytes() {
  try { const m = await idb(['items'], 'readonly', t => t.objectStore('items').getAll()); return m.reduce((n, x) => n + (x.remote ? 0 : x.size || 0), 0); } catch { return 0; }
}
async function clearSaved() {
  try { await idb(['items', 'blobs'], 'readwrite', t => { t.objectStore('items').clear(); t.objectStore('blobs').clear(); }); } catch {}
  if (P.cur && P.cur._saved) stopPlayback();
  if (A.cur && A.cur._saved) closeAudio();
  for (let i = lib.length - 1; i >= 0; i--) if (lib[i]._saved) lib.splice(i, 1);
  for (let i = audioLib.length - 1; i >= 0; i--) if (audioLib[i]._saved) audioLib.splice(i, 1);
  toast('Saved library cleared'); render();
}
async function restoreLib() {
  let metas;
  try { metas = await idb(['items'], 'readonly', t => t.objectStore('items').getAll()); } catch { return; }
  if (!metas || !metas.length) return;
  metas.sort((a, b) => (a.added || 0) - (b.added || 0));
  let n = 0;
  for (const m of metas) {
    let src = m.src;
    if (!m.remote) {
      let blob; try { blob = await idb(['blobs'], 'readonly', t => t.objectStore('blobs').get(m.k)); } catch {}
      if (!blob) continue; src = URL.createObjectURL(blob);
    }
    const isA = m.kind === 'a', list = isA ? audioLib : lib;
    const key = (isA ? 'a:' : 'v:') + m.name + ':' + (m.size || 0);
    if (list.some(x => x.key === key && x.folder === m.folder)) continue;
    const it = { id: uid(), name: m.name, src, folder: m.folder, size: m.size, mtime: m.mtime, ext: m.ext, added: m.added, priv: m.priv, dur: m.dur, remote: m.remote, key, _saved: true };
    list.push(it); n++;
    if (isA && !it.dur) {
      const probe = new Audio(); probe.preload = 'metadata'; probe.src = src;
      probe.onloadedmetadata = () => { it.dur = probe.duration; updateSaved(it, { dur: it.dur }); };
    }
  }
  if (n) render();
}

function addItem(o) {
  const { _blob, ...rest } = o;
  const it = { id: uid(), added: Date.now(), ...rest };
  it.key = 'v:' + it.name + ':' + (it.size || 0);
  lib.push(it);
  if (it.remote || _blob) saveItem(it, 'v', _blob);
  return it;
}
function addVideoFile(f) {
  const name = f.name.replace(/\.[^.]+$/, ''), folder = folderOf(f), key = 'v:' + name + ':' + f.size;
  if (lib.some(x => x.key === key && x.folder === folder)) return false;     // skip duplicates
  addItem({ _blob: f, name, src: URL.createObjectURL(f), folder, size: f.size, mtime: f.lastModified, ext: (f.name.match(/\.([a-z0-9]+)$/i) || [])[1] });
  return true;
}
function addAudioFiles(files) {
  let n = 0;
  [...files].forEach(f => {
    if (!isAudioFile(f)) return;
    const name = f.name.replace(/\.[^.]+$/, ''), folder = folderOf(f), key = 'a:' + name + ':' + f.size;
    if (audioLib.some(x => x.key === key)) return;
    const it = { id: uid(), name, src: URL.createObjectURL(f), size: f.size, folder, mtime: f.lastModified, added: Date.now(), key };
    audioLib.push(it); n++; saveItem(it, 'a', f);
    const probe = new Audio(); probe.preload = 'metadata'; probe.src = it.src;       // read duration
    probe.onloadedmetadata = () => {
      it.dur = probe.duration; updateSaved(it, { dur: it.dur });
      const s = $(`.arow[data-id="${it.id}"] small`); if (s) s.textContent = audioSub(it);

function playFrom(it, paneId, ctx) {

async function hashPin(p) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('np:' + p));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch { let h = 5381; for (const c of 'np:' + p) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + h; }
}
function renderPrivacy() {
  const el = $('#pane-privacy'), pin = store.get('np_pin');
  if (!pin) {

      <p class="mut">Hide videos behind a 4–6 digit PIN.</p>

  } else if (G.mode === 'bri') {
    P.bright = Math.min(1.5, Math.max(.3, G.bri - dy / (G.h * .85) * 1.2)); applyBright();
    gShow('sun', Math.round(P.bright * 100) + '%', (P.bright - .3) / 1.2);
  }
});
function gEnd(e) {
  if (!G || e.pointerId !== G.id) return;
  clearTimeout(G.timer);
  if (G.mode) {
    gUsed = true; setTimeout(() => gUsed = false, 350);
    if (G.mode === 'speed') v.playbackRate = P.speed;
    if (G.mode === 'bri') store.set('np_bright', String(P.bright));
    if (G.mode === 'vol') { v.defaultMuted = false; try { syncPanel(); } catch {} }
    gHide(G.mode === 'speed' ? 120 : 650); if (G.mode !== 'vol') gind.classList.remove('boost');
  }
  G = null;
}
gEl.addEventListener('pointerup', gEnd); gEl.addEventListener('pointercancel', gEnd);
gEl.addEventListener('click', e => { if (gUsed) { e.stopImmediatePropagation(); e.preventDefault(); gUsed = false; } }, true);

/* ---- seek bar ---- */
const seekPct = e => { const r = seekEl.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
let seekThrottle = 0;
function seekPreview(e, commit) {
  const p = seekPct(e), t = p * (v.duration || 0);
  prog.style.width = knob.style.left = tip.style.left = p * 100 + '%';
  tip.textContent = fmt(t); $('#tCur').textContent = fmt(t);
  const now = Date.now();
  if (commit || now - seekThrottle > 150) { seekThrottle = now; if (isFinite(v.duration)) v.currentTime = t; }
}
seekEl.addEventListener('pointerdown', e => {
  if (!isFinite(v.duration)) return;
  seekEl.setPointerCapture(e.pointerId); P.seeking = true; seekEl.classList.add('drag'); clearTimeout(P.hideTimer); seekPreview(e);
});
seekEl.addEventListener('pointermove', e => { if (P.seeking) seekPreview(e); });
const endSeek = e => { if (!P.seeking) return; seekPreview(e, true); P.seeking = false; seekEl.classList.remove('drag'); showCtrl(); update(); };
seekEl.addEventListener('pointerup', endSeek);
seekEl.addEventListener('pointercancel', endSeek);

/* ---- lock ---- */
let unlockTimer;
function setLocked(on) {
  P.locked = on;
  if (on) { ctrl.classList.add('hidden'); clearTimeout(P.hideTimer); showUnlock(); toast('Screen locked'); }
  else { $('#btnUnlock').classList.remove('show'); }
}
function showUnlock() {
  const b = $('#btnUnlock'); b.classList.add('show');
  clearTimeout(unlockTimer); unlockTimer = setTimeout(() => b.classList.remove('show'), 2500);
}
$('#btnLock').onclick = () => setLocked(true);
$('#btnUnlock').onclick = () => { setLocked(false); showCtrl(); toast('Screen unlocked'); };

/* ---- mute / background audio ---- */
$('#btnMute').onclick = () => {
  v.muted = !v.muted; setIco($('#btnMute'), v.muted ? 'mute' : 'vol'); $('#btnMute').classList.toggle('on', v.muted);
  toast(v.muted ? 'Muted' : 'Sound on');
};
$('#btnBg').onclick = () => {
  P.bg = !P.bg; $('#btnBg').classList.toggle('on', P.bg);
  toast(P.bg ? 'Background audio ON: keeps playing when you leave' : 'Background audio OFF');
};
function setupMediaSession(item) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: item.name, artist: 'R-Player', album: item.folder });
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    h('play',  () => { P.userPaused = false; v.play(); });
    h('pause', () => { P.userPaused = true; v.pause(); });
    h('seekbackward', () => skip(-10));
    h('seekforward',  () => skip(10));
    h('seekto', d => { v.currentTime = d.seekTime; });
  } catch {}
}

/* ---- speed ---- */
function setSpeed(s) { P.speed = s; v.defaultPlaybackRate = v.playbackRate = s; $('#btnSpeed').textContent = s + 'x'; $('#btnSpeed').classList.toggle('on', s !== 1); }
$('#btnSpeed').onclick = () => openSheet('Playback speed', SPEEDS.map(s => ({ label: s === 1 ? '1x (Normal)' : s + 'x', active: s === P.speed, fn: () => setSpeed(s) })));

/* ---- aspect ratio ---- */
$('#btnAspect').onclick = () => {
  P.fitIdx = (P.fitIdx + 1) % FITS.length;
  stage.dataset.fit = FITS[P.fitIdx][0]; toast(FITS[P.fitIdx][1]);
  $('#btnAspect').classList.toggle('on', P.fitIdx !== 0);
};

/* ---- fullscreen (CSS full-screen + real Fullscreen API when the browser allows it) ---- */
function setFull(on) {
  P.full = on; $('#vbox').classList.toggle('full', on); playerEl.classList.toggle('isfull', on);
  setIco($('#btnFS'), on ? 'fsx' : 'fs'); showCtrl();
}
async function toggleFS() {
  const on = !P.full, de = document.documentElement;
  setFull(on);
  try {
    if (on) {
      if (de.requestFullscreen) await de.requestFullscreen(); else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
      if (settings.autoRotate && v.videoWidth >= v.videoHeight) { try { await screen.orientation.lock('landscape'); } catch {} }
    } else {
      if (document.fullscreenElement) await document.exitFullscreen();
      try { screen.orientation.unlock(); } catch {}
    }
  } catch {}
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && P.full) setFull(false); });
$('#btnFS').onclick = toggleFS;
/* Auto Rotate: turning the phone sideways/upright switches full-screen on/off */
const landMQ = matchMedia('(orientation: landscape)');
if (landMQ.addEventListener) landMQ.addEventListener('change', e => {
  if (playerEl.hidden || !settings.autoRotate) return;
  if (e.matches && !P.full) setFull(true);
  else if (!e.matches && P.full) { setFull(false); try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }
});

/* ---- player info panel (title, actions, next video) ---- */
const AP = { on: store.get('np_autoplay') !== '0' };
function renderPanel() {
  const it = P.cur; if (!it) return;
  $('#pTitle2').textContent = it.name;
  const parts = [sizeOf(it), extOfItem(it)]; if (heightOf(it) >= 720) parts.push(resLabel(it));
  $('#pMeta').textContent = parts.join(' • ');
  syncPanel();
  const nx = Q.list[Q.i + 1], body = $('#nextBody');
  if (nx) {
    const n = nx.it;
    body.innerHTML = (nx.k === 'v' ? thumbHTML(n, 'dur') : `<div class="acover">${ico('audio')}</div>`) +
      `<div class="minfo"><b>${esc(n.name)}</b><small>${esc(nx.k === 'v' ? metaText(n, 'ds') : (n.dur ? fmtD(n.dur) + ' • ' : '') + fmtSize(n.size || 0))}</small></div><span class="nplay">${ico('play')}</span>`;
    if (nx.k === 'v') hydrateThumbs(body);
  } else body.innerHTML = '<div class="nonext">This is the last video in the list.</div>';
}
function syncPanel() {
  const it = P.cur, fav = it && isFav(it);
  $('#btnLike').classList.toggle('liked', !!fav);
  $('#btnLike .i2').innerHTML = ico(fav ? 'heart' : 'heart-o');
  $('#qMute .i2').innerHTML = ico(v.muted ? 'mute' : 'vol');
  $('#qMute').classList.toggle('on', v.muted);
  $('#qBg').classList.toggle('on', P.bg);
  $('#qAspect').classList.toggle('on', P.fitIdx !== 0);
  $('#aSpeed').classList.toggle('on', P.speed !== 1);
  $('#aSub').classList.toggle('on', [...v.textTracks].some(t => t.mode === 'showing'));
  $('#apToggle').classList.toggle('on', AP.on);
}
$('#btnLike').onclick = () => { if (!P.cur) return; toggleFav(P.cur); syncPanel(); toast(isFav(P.cur) ? 'Added to favorites' : 'Removed from favorites'); };
$('#aDl').onclick = () => {
  const it = P.cur; if (!it) return;
  if (it.remote && /^https?:/.test(it.src)) { startDownload(it.src); toast('Download started – see Downloader'); }
  else toast('This video is already on your device');
};
$('#aSpeed').onclick = () => $('#btnSpeed').click();
$('#aAudio').onclick = () => $('#btnAT').click();
$('#aSub').onclick = () => $('#btnCC').click();
[['qLock', 'btnLock'], ['qMute', 'btnMute'], ['qBg', 'btnBg'], ['qAspect', 'btnAspect'], ['qShot', 'btnShot']].forEach(([a, b]) =>
  $('#' + a).onclick = () => { $('#' + b).click(); syncPanel(); });
$('#btnPMenu').onclick = () => openSheet('Player', [
  { icon: 'speed', label: 'Playback speed', fn: () => $('#btnSpeed').click() },
  { icon: 'audio', label: 'Audio track', fn: () => $('#btnAT').click() },
  { icon: 'cam', label: 'Screenshot', fn: () => $('#btnShot').click() },
  { icon: 'aspect', label: 'Aspect ratio', fn: () => { $('#btnAspect').click(); syncPanel(); } },
  { icon: 'phones', label: P.bg ? 'Background audio: on' : 'Background audio: off', fn: () => { $('#btnBg').click(); syncPanel(); } },
  { icon: v.muted ? 'mute' : 'vol', label: v.muted ? 'Unmute' : 'Mute', fn: () => { $('#btnMute').click(); syncPanel(); } },
  { icon: 'lock', label: 'Lock screen', fn: () => $('#btnLock').click() },
]);
$('#apToggle').onclick = () => { AP.on = !AP.on; store.set('np_autoplay', AP.on ? '1' : '0'); syncPanel(); toast(AP.on ? 'Autoplay on' : 'Autoplay off'); };
$('#nextBody').onclick = () => { if (Q.list[Q.i + 1]) queueStep(1, false); };
$('#btnNext').onclick = () => { if (!queueStep(1, false)) toast('No next video'); };
$('#btnPrev').onclick = () => { if (v.currentTime > 3 || !queueStep(-1, false)) { v.currentTime = 0; update(); } };

/* ---- screenshot ---- */
$('#btnShot').onclick = () => {
  if (!v.videoWidth) return toast('Nothing to capture yet');
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  try {
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(b => {
      if (!b) return toast('Capture failed');
      const a = document.createElement('a'), name = (P.cur?.name || 'video').replace(/[^\w\-]+/g, '_');
      a.href = URL.createObjectURL(b); a.download = `${name}_${fmt(v.currentTime).replace(/:/g, '-')}.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      toast('Screenshot saved');
    }, 'image/png');
  } catch { toast('This server does not allow screenshots (CORS). Local files work.'); }
};

/* ---- subtitles ---- */
const srt2vtt = s => 'WEBVTT\n\n' + s.replace(/\r+/g, '').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
function selectSub(track) {
  [...v.textTracks].forEach(t => t.mode = t === track ? 'showing' : 'disabled');
  updateCCState();
}
function updateCCState() { $('#btnCC').classList.toggle('on', [...v.textTracks].some(t => t.mode === 'showing')); }
$('#btnCC').onclick = () => {
  const tracks = [...v.textTracks].filter(t => t.kind === 'subtitles' || t.kind === 'captions');
  const items = [{ label: 'Off', active: !tracks.some(t => t.mode === 'showing'), fn: () => selectSub(null) }];
  tracks.forEach((t, i) => items.push({ label: t.label || t.language || 'Track ' + (i + 1), active: t.mode === 'showing', fn: () => selectSub(t) }));
  items.push({ icon: 'cc', label: 'Load subtitle file (.srt / .vtt)…', fn: () => $('#subPicker').click() });
  openSheet('Subtitles', items);
};
$('#subPicker').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let txt = String(rd.result); if (!/^\uFEFF?WEBVTT/.test(txt)) txt = srt2vtt(txt);
    const tr = document.createElement('track');
    tr.kind = 'subtitles'; tr.label = f.name.replace(/\.[^.]+$/, ''); tr.srclang = 'und';
    tr.src = URL.createObjectURL(new Blob([txt], { type: 'text/vtt' }));
    v.appendChild(tr);
    setTimeout(() => { selectSub(tr.track); toast('Subtitles on'); }, 60);
  };
  rd.readAsText(f);
};

/* ---- audio tracks ---- */
$('#btnAT').onclick = () => {
  const at = v.audioTracks;
  if (at && at.length > 1) {
    openSheet('Audio track', [...at].map((t, i) => ({
      label: t.label || t.language || 'Track ' + (i + 1), active: t.enabled,
      fn: () => { [...at].forEach((x, j) => x.enabled = j === i); toast('Audio: ' + (t.label || t.language || 'Track ' + (i + 1))); }
    })));
  } else openSheet('Audio track', [
    { label: 'Default audio', active: true },
    { label: 'Only one audio track found. Some browsers (e.g. Chrome) hide extra tracks from web pages.', note: true },
  ]);
};

/* ---- keyboard shortcuts (desktop) ---- */
document.addEventListener('keydown', e => {
  if (playerEl.hidden || /INPUT|TEXTAREA/.test(e.target.tagName) || P.locked) return;
  const k = e.key;
  if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
  else if (k === 'ArrowRight') skip(10);
  else if (k === 'ArrowLeft') skip(-10);
  else if (k === 'ArrowUp') { v.volume = Math.min(1, v.volume + .1); toast('Volume ' + Math.round(v.volume * 100) + '%'); }
  else if (k === 'ArrowDown') { v.volume = Math.max(0, v.volume - .1); toast('Volume ' + Math.round(v.volume * 100) + '%'); }
  else if (k === 'm') $('#btnMute').click();
  else if (k === 'f') toggleFS();
  else if (k === 'Escape' && !P.full) $('#pBack').click();
  showCtrl();
});

/* ================= Music / Audio ================= */
const A = { el: $('#a'), cur: null };

function renderMusic() {
  if (state.sec !== 'music') return;
  const el = $('#pane-music'), items = audioVisible();
  if (!audioLib.length) { el.innerHTML = emptyHTML('audio', 'No music yet', 'Add MP3 and other audio files, or a whole folder', true); return; }
  el.innerHTML = summaryHTML(items.length, items.length === 1 ? 'song' : 'songs', items.reduce((s, a) => s + (a.size || 0), 0), false) +
    (items.length ? items.map(a => arow(a)).join('') : emptyHTML('search', 'No songs match your search', ''));
}
$('#pane-music').onclick = e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (act) return doAct(act);
  const more = e.target.closest('[data-amore]');
  if (more) { e.stopPropagation(); return audioMenu(audioLib.find(x => x.id === more.dataset.amore)); }
  const row = e.target.closest('.arow'); if (!row) return;
  const item = audioLib.find(x => x.id === row.dataset.id);
  if (A.cur === item) return toggleAudio();
  const list = audioVisible();
  startQueue(list.map(x => ({ k: 'a', it: x })), list.indexOf(item));
};
function audioMenu(a) {
  openSheet(a.name, [
    { icon: 'play', label: 'Play', fn: () => startQueue([{ k: 'a', it: a }], 0) },
    { icon: 'playlist', label: 'Add to playlist', fn: () => addToPlaylist(a) },
    { icon: 'trash', label: 'Remove from list', fn: () => removeAudio(a.id) },
  ]);
}

function playAudio(item) {
  if (P.cur) stopPlayback();
  A.cur = item; A.el.src = item.src;
  A.el.play().catch(() => toast('Cannot play this audio file'));
  setupAudioSession(item); updateAmini(); renderMusic();
}
function toggleAudio() { if (A.cur) A.el.paused ? A.el.play() : A.el.pause(); }
function stepAudio(d) {
  if (!A.cur) return;
  if (d < 0 && A.el.currentTime > 3) { A.el.currentTime = 0; return; }   // restart track first
  if (!queueStep(d, true)) { A.el.currentTime = 0; }
}
function closeAudio() {
  if (!A.cur) return;
  A.el.pause(); A.el.removeAttribute('src'); A.el.load(); A.cur = null;
  if ('mediaSession' in navigator) ['previoustrack', 'nexttrack'].forEach(a => { try { navigator.mediaSession.setActionHandler(a, null); } catch {} });
  updateAmini(); renderMusic();
}
function removeAudio(id) {
  const i = audioLib.findIndex(a => a.id === id); if (i < 0) return;
  if (A.cur === audioLib[i]) closeAudio();
  dropSaved(audioLib[i]); URL.revokeObjectURL(audioLib[i].src); audioLib.splice(i, 1); renderMusic();
}

function updateAmini() {
  const show = !!A.cur;
  $('#amini').hidden = !show; document.body.classList.toggle('has-amini', show);
  if (show) $('#aTitle').textContent = A.cur.name;
  setIco($('#aPlay'), A.el.paused ? 'play' : 'pause');
  $$('.arow.playing').forEach(r => r.classList.toggle('paused', A.el.paused));
}
function updateAminiProgress() {
  const d = A.el.duration || 0, c = A.el.currentTime || 0;
  $('#aprog').style.width = (d && isFinite(d) ? c / d * 100 : 0) + '%';
  $('#aSub').textContent = fmt(c) + ' / ' + fmt(d);
}
['play', 'pause'].forEach(ev => A.el.addEventListener(ev, updateAmini));
A.el.addEventListener('timeupdate', updateAminiProgress);
A.el.addEventListener('loadedmetadata', updateAminiProgress);
A.el.addEventListener('ended', () => { if (!queueStep(1, false)) { A.el.currentTime = 0; updateAmini(); } });
A.el.addEventListener('error', () => { if (A.el.getAttribute('src')) toast('Cannot play this audio file'); });

$('#aPlay').onclick = toggleAudio;
$('#aPrev').onclick = () => stepAudio(-1);
$('#aNext').onclick = () => stepAudio(1);
$('#aClose').onclick = closeAudio;
$('#aInfo').onclick = () => go('music');

function setupAudioSession(it) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: it.name, artist: 'R-Player', album: it.folder || 'Music' });
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    h('play', () => A.el.play()); h('pause', () => A.el.pause());
    h('previoustrack', () => stepAudio(-1)); h('nexttrack', () => stepAudio(1));
    h('seekbackward', () => { A.el.currentTime = Math.max(0, A.el.currentTime - 10); });
    h('seekforward',  () => { A.el.currentTime = Math.min(A.el.duration || 1e9, A.el.currentTime + 10); });
    h('seekto', d => { A.el.currentTime = d.seekTime; });
  } catch {}
}

/* ================= Boot ================= */
render(); renderTasks(); restoreLib();
const splash = $('#splash');
const hideSplash = () => { splash.classList.add('out'); setTimeout(() => splash.remove(), 700); };
splash.onclick = hideSplash; setTimeout(hideSplash, 1700);
})();
</script>
</body>
</html>
